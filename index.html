*{

body{

.serif{

}

  -ms-overflow-style:none;
  scrollbar-width:none
}

@keyframes pulse-amber {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(140,255,138,0.4);
  }

  50% {
    box-shadow: 0 0 0 10px rgba(140,255,138,0);
  }
}

@keyframes flame-flicker{
  0%,100%{
    transform: scaleY(1) rotate(-1deg);
  }

  50%{
    transform: scaleY(1.08) rotate(1deg);
  }
}

@keyframes shimmer{
  0%{
    transform: translateX(-100%);
  }

  100%{
    transform: translateX(200%);
  }
}

@keyframes checkin-flip{
  0%{
    transform:rotateY(0) translateY(0)
  }

  25%{
    transform:rotateY(15deg) translateY(-8px)
  }

  50%{
    transform:rotateY(0) translateY(0)
  }

  75%{
    transform:rotateY(-15deg) translateY(-8px)
  }

  100%{
    transform:rotateY(0) translateY(0)
  }
}

@keyframes wave{
  0%,100%{
    transform:scaleY(0.6)
  }

  50%{
    transform:scaleY(1.25)
  }
}

@keyframes spin-slow{
  from{
    transform:rotate(0)
  }

  to{
    transform:rotate(360deg)
  }
}

@keyframes coinFloat{
  0%{
    opacity:0;
    transform:translate(-50%,0) scale(0.6)
  }

  20%{
    opacity:1
  }

  80%{
    opacity:1;
    transform:translate(-50%,-24px) scale(1)
  }

  100%{
    opacity:0;
    transform:translate(-50%,-40px) scale(0.9)
  }
}

@keyframes coinBump{
  0%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.15)
  }

  100%{
    transform:scale(1)
  }
}

kubomfya akasuba. Formula: 6CO₂ + 6H₂O -> C₆H₁₂O₆ + 6O₂. Stage ibili: Light mu grana na Dark mu stroma. Ba ECZ balikulisha sana uyu mutwe - 8/10 years!",nya:"Photosynthesis ndi njira ya zomera kupanga chakudya pogwiritsa ntchito dzuwa. 6CO₂ + 6H₂O -> C₆H₁₂O₆ + 6O₂. Magawo awiri: Kuwala mu grana ndi Mdima mu stroma. ECZ imakonda kwambiri mutu uwu!"},osmosis:{topic:"Osmosis",en:"Osmosis: water moves from HIGH water potential (dilute) to LOW (concentrated) through semi-permeable membrane. ECZ trick: Root hair cells in Kitwe soils - water enters by osmosis. Don't confuse with diffusion (all particles). Exam Q: Why does salt make cassava shrink? Water leaves by osmosis.",bem:"Osmosis: amenshi yafuma ku HIGH water potential ukuya ku LOW ukupitila mu membrane. Mu myela ya Kitwe, amenshi yinjila mu root hair ukupitila mu osmosis. ECZ balikulisha uku - kumbukila!",nya:"Osmosis: madzi amachoka ku HIGH kupita ku LOW kudutsa mu membrane. Mu mizu ya Kitwe, madzi amalowa ndi osmosis. Osasokoneza ndi diffusion!"},mitosis:{topic:"Mitosis vs Meiosis",en:"Mitosis vs Meiosis - ECZ loves this table: MITOSIS: 1 division, 2 identical diploid cells, for growth/repair, same chromosome number. MEIOSIS: 2 divisions, 4 haploid gametes, for reproduction, halves chromosomes, crossing over happens. Trick: Remember PMAT stages.",bem:"Mitosis vs Meiosis: Mitosis - 1 division, 2 cells identical, pa growth. Meiosis - 2 divisions, 4 cells haploid, pa reproduction. Ba ECZ balikulisha uku - lembani table!",nya:"Mitosis vs Meiosis: Mitosis - 1 magawano, 2 maselo ofanana, pakukula. Meiosis - 2 magawano, 4 maselo a haploid, pobereka. ECZ imakonda!"},algebra:{topic:"Algebra",en:"Solve 2x + 5 = 15 (ECZ 2023 Q1). Step: 2x = 15-5 => 2x=10 => x=5. Check: 2*5+5=15 ✓. Common mistake: forgetting to do same to both sides. For ECZ, always show working for 2 marks.",bem:"Solve 2x+5=15: 2x=15-5=10, x=5. Mukonke: 2*5+5=15 ✓. Ba ECZ bapela 2 marks - lomba working yonse!",nya:"Thetsani 2x+5=15: 2x=10, x=5. Onani: 2*5+5=15. ECZ imapereka 2 marks - lembani ntchito yonse!"},redox:{topic:"Redox",en:"Redox: REDuction = gain of electrons / loss of oxygen, OXidation = loss of electrons / gain of oxygen. OIL RIG mnemonic: Oxidation Is Loss, Reduction Is Gain. Balancing tip: Make atoms equal first, then charges with e-. Kitwe mines example: Cu²⁺ + Fe -> Fe²⁺ + Cu (redox in copper extraction).",bem:"Redox: Reduction = ukupoka electrons, Oxidation = ukuluza electrons. OIL RIG: Oxidation Is Loss. Pa mine ya copper, redox yacitika.",nya:"Redox: Reduction = kutenga electrons, Oxidation = kutaya electrons. Mu migodi ya copper ya Kitwe, redox imachitika."},quadratic:{topic:"Quadratic",en:"Quadratic formula: x = [-b ± √(b²-4ac)] / 2a. Chanda's Kitwe trick: Always check discriminant first: b²-4ac. If >0 = 2 solutions, =0 =1 solution, <0 = no real. ECZ 8-pointer method: Try factorization first - faster for 1 mark.",bem:"Quadratic: x=[-b ± √(b²-4ac)]/2a. Trick ya Chanda: mona b²-4ac pali. ECZ style - try factorization first!",nya:"Quadratic: x=[-b ± √(b²-4ac)]/2a. Njira ya Chanda: onani b²-4ac poyamba. ECZ - yesani factorization poyamba!"}};function uc(){let[e,n]=k.useState(1),[t,r]=k.useState("0977123456"),[l,o]=k.useState(lc[0]),[f,a]=k.useState("Grade 11"),[c,p]=k.useState("battlers"),[_,S]=k.useState("Hope Chaka"),[z,w]=k.useState(""),[$,Q]=k.useState("Copperbelt"),[Z,v]=k.useState(!1),[d,h]=k.useState(!1),[P,m]=k.useState(!1),[g,W]=k.useState("room"),[H,q]=k.useState(new Date),[V,D]=k.useState(()=>{let E=new Date;return E.setDate(E.getDate()+6),E.setHours(E.getHours()+14),E.setMinutes(E.getMinutes()+22),E}),[oe,Ct]=k.useState(new Date),[Ie,Cn]=k.useState(0),[Ze,cr]=k.useState(!0),[me,Qt]=k.useState(!0),[Rn,be]=k.useState(!1),Qe=(E)=>{let F=(E||"").replace(/\D/g,""),B=F.slice(0,3);if(B==="096"||B==="076")return{name:"MTN",color:"#FFCC00",bg:"#FFCC00",text:"black",label:"MTN",logo:"M"};if(B==="095")return{name:"Zamtel",color:"#1B8E1B",bg:"#1B8E1B",text:"white",label:"Zamtel",logo:"Z"};if(B==="057"
