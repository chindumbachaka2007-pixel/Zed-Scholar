-- Enable RLS or leave open for preview (publishable key)
create table if not exists profiles (
  id text primary key,
  phone text unique not null,
  name text not null,
  school text,
  grade text,
  province text default 'Copperbelt',
  district text default 'Ndola',
  account_code text,
  coins int default 0,
  streak int default 0,
  password text,
  created_at timestamp default now()
);

create table if not exists rooms (
  id text primary key,
  code text unique not null,
  name text not null,
  school text,
  members int default 1,
  max_members int default 25,
  created_by text references profiles(id),
  created_at timestamp default now()
);

create table if not exists room_members (
  id text primary key,
  room_id text references rooms(id) on delete cascade,
  user_id text references profiles(id) on delete cascade,
  score int default 0,
  created_at timestamp default now(),
  unique(room_id, user_id)
);

create table if not exists messages (
  id text primary key,
  room_id text references rooms(id) on delete cascade,
  user_id text references profiles(id),
  content text not null,
  created_at timestamp default now()
);

create table if not exists quiz_attempts (
  id text primary key,
  user_id text references profiles(id),
  room_id text references rooms(id),
  subject text,
  score int,
  total int,
  created_at timestamp default now()
);

-- For quick preview allow public access:
alter table profiles enable row level security;
alter table rooms enable row level security;
alter table room_members enable row level security;
alter table messages enable row level security;
alter table quiz_attempts enable row level security;

create policy "open" on profiles for all using (true) with check (true);
create policy "open" on rooms for all using (true) with check (true);
